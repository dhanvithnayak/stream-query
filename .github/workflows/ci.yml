name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Agent Image
        run: docker build -t streamquery-agent:test ./agent

      - name: Build Producer Image
        run: docker build -t streamquery-producer:test ./producer

      - name: Build Consumer Image
        run: docker build -t streamquery-consumer:test ./consumer

      - name: Build Airflow Image
        run: docker build -t streamquery-airflow:test -f Dockerfile.airflow .
